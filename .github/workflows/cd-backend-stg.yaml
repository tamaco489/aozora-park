name: cd-backend-stg

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/cd-backend-stg.yaml"
  # stg は作業中のブランチからも配信したいことがあるため、任意のブランチから手で起こせるようにする
  # 手元の just deploy-stg と同じ用途で、実行したブランチの内容がそのまま stg に入る
  workflow_dispatch:
    inputs:
      services:
        # main への push では絞らない、変更の内容から対象を判定すると片方が古いまま残る
        # 対象を選べるのは、人が意図して起こすこちらだけにする
        description: 'デプロイするサービスの JSON の配列 (空なら全サービス)。例: ["api"]'
        type: string
        required: false

permissions:
  contents: read
  id-token: write

# 検査と違い打ち切らずに直列化する、途中で止めても GCP 側のビルドは止まらず古いイメージが後から Cloud Run を更新しうる
# 直列化するのは run 同士で、同じ run に属する matrix のジョブはこの group では待ち合わせない
concurrency:
  group: cd-backend-stg
  cancel-in-progress: false

# infra/envs/stg の terraform output が出す値、秘匿値ではない
env:
  WORKLOAD_IDENTITY_PROVIDER: projects/1098169918715/locations/global/workloadIdentityPools/github/providers/github
  SERVICE_ACCOUNT: sa-cd-backend@stg-aozora-park.iam.gserviceaccount.com
  PROJECT_ID: stg-aozora-park
  REGION: asia-northeast1

defaults:
  run:
    working-directory: backend

jobs:
  backend-deploy-stg:
    runs-on: ubuntu-latest
    # サービスごとに別のビルドを起こす、1 回のビルドで 2 サービスを作ると cloudbuild.yaml が digest を書く /workspace のパスが衝突する
    # 変更の内容から対象を絞る判定は入れない、internal/platform や go.mod を触ると結局どちらも対象になるため常に両方をビルドする
    strategy:
      # 片方のビルドが落ちてももう片方の結果を知りたいため、既定の打ち切りを外す
      fail-fast: false
      matrix:
        # 既定の一覧はここが唯一の定義、backend/scripts/deploy-stg.sh の ALL_SERVICES と同じにする
        service: ${{ fromJSON(inputs.services || '["api", "priority-pass-issuer"]') }}
    steps:
      # cloudbuild.yaml は手元から渡すため、ソースの取得とは別にチェックアウトが要る
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
      # ランナーの gcloud には beta が入っていないため明示して導入する
      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: beta
      # 引数と matrix のサービス一覧は backend/scripts/deploy-stg.sh と同じ、片方を変更したらもう片方も直す
      # ログを表示するため beta を使う (GA の submit は CLOUD_LOGGING_ONLY のログを出さない)
      - name: Submit build
        env:
          SHA: ${{ github.sha }}
          SERVICE: ${{ matrix.service }}
        run: |
          gcloud beta builds submit "projects/${PROJECT_ID}/locations/${REGION}/connections/github/gitRepositoryLinks/aozora-park" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --revision="${SHA}" \
            --config=cloudbuild.yaml \
            --service-account="projects/${PROJECT_ID}/serviceAccounts/sa-deployer@${PROJECT_ID}.iam.gserviceaccount.com" \
            --substitutions="_SERVICE=${SERVICE},_TAG=${SHA}"
