name: ci-frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yaml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yaml"

permissions:
  contents: read

# 同じブランチへの連続 push で古い実行を打ち切る
concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          # 型情報を使う lint のバイナリが 22MB あり、毎回の取得が無駄になる
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # package-lock.json のとおりに入れる (npm install と違って lock を書き換えない)
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          # 型情報を使う lint のバイナリが 22MB あり、毎回の取得が無駄になる
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      # build は tsc -b を挟むため、型の検査もここで落ちる
      - name: Build
        run: npm run build
