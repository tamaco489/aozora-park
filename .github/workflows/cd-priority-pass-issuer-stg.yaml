name: cd-priority-pass-issuer-stg

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/cd-priority-pass-issuer-stg.yaml"
      - ".github/workflows/scripts/deploy-priority-pass-issuer-stg.sh"
  # stg は作業中のブランチからも配信したいことがあるため、任意のブランチから手で起こせるようにする
  # 手元の just deploy-priority-pass-issuer-stg と同じ用途で、実行したブランチの内容がそのまま stg に入る
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# 検査と違い打ち切らずに直列化する、途中で止めても GCP 側のビルドは止まらず古いイメージが後から Cloud Run を更新しうる
# サービスごとにワークフローを分けているため、priority-pass-issuer の配信が他のサービスの配信を待つことはない
concurrency:
  group: cd-priority-pass-issuer-stg
  cancel-in-progress: false

# infra/envs/stg の terraform output が出す値、秘匿値ではない
env:
  WORKLOAD_IDENTITY_PROVIDER: projects/1098169918715/locations/global/workloadIdentityPools/github/providers/github
  SERVICE_ACCOUNT: sa-cd-backend@stg-aozora-park.iam.gserviceaccount.com

jobs:
  priority-pass-issuer-deploy-stg:
    runs-on: ubuntu-latest
    steps:
      # cloudbuild.yaml とデプロイのスクリプトは手元から渡すため、ソースの取得とは別にチェックアウトが要る
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
      # ランナーの gcloud には beta が入っていないため明示して導入する
      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: beta
      - name: Submit build
        env:
          SHA: ${{ github.sha }}
        run: .github/workflows/scripts/deploy-priority-pass-issuer-stg.sh "${SHA}"
