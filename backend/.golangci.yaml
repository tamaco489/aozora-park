version: "2"

# 依存の向きは .claude/rules/go/coding.md の「依存の向き」を検査対象にしている
# 機能パッケージを増やしたら park と同じ5つのルールを複製する
linters:
  default: standard
  enable:
    - copyloopvar
    - depguard
    - forbidigo
    - intrange
    - modernize
    - usestdlibvars
  settings:
    # forbidigo はソースに現れる識別子を正規表現で禁止する、パッケージ単位の禁止は depguard が見る
    forbidigo:
      analyze-types: false
      forbid:
        - pattern: ^iota$
          msg: 値を1つずつ明示する、並びが変わると保存済みの値の意味が変わるため
        - pattern: ^reflect\.DeepEqual$
          msg: 構造体の比較は cmp.Diff を使う
        - pattern: ^os\.(Getenv|LookupEnv)$
          msg: 環境変数は internal/platform/config でだけ読む

    # depguard はパッケージの依存関係を検査する、ルールは .claude/rules/go/coding.md の「依存の向き」を参照する
    depguard:
      rules:
        # lax で deny に載せたものだけを禁じ、allow をその例外として扱う
        park-domain:
          list-mode: lax
          files:
            - "**/internal/park/domain/**"
          allow:
            - github.com/tamaco489/aozora-park/backend/internal/park/domain
            - github.com/tamaco489/aozora-park/backend/internal/platform
          deny:
            - pkg: github.com/tamaco489/aozora-park/backend/internal
              desc: domain は usecase と infrastructure と他の機能を知らない
            - pkg: github.com/tamaco489/aozora-park/backend/gen
              desc: 入出力の変換は handler の仕事
            - pkg: connectrpc.com/connect
              desc: connect のコードは interceptor が apperr から変換する
            - pkg: cloud.google.com/go/firestore
              desc: 永続化の相手を知るのは infrastructure だけ

        park-usecase:
          list-mode: lax
          files:
            - "**/internal/park/usecase/**"
          allow:
            - github.com/tamaco489/aozora-park/backend/internal/park/domain
            - github.com/tamaco489/aozora-park/backend/internal/park/usecase
            - github.com/tamaco489/aozora-park/backend/internal/platform
          deny:
            - pkg: github.com/tamaco489/aozora-park/backend/internal
              desc: usecase は infrastructure と handler と他の機能を知らない
            - pkg: github.com/tamaco489/aozora-park/backend/gen
              desc: 入出力の変換は handler の仕事
            - pkg: connectrpc.com/connect
              desc: connect のコードは interceptor が apperr から変換する
            - pkg: cloud.google.com/go/firestore
              desc: トランザクションは infrastructure の内側に閉じる

        park-infrastructure:
          list-mode: lax
          files:
            - "**/internal/park/infrastructure/**"
          allow:
            - github.com/tamaco489/aozora-park/backend/internal/park/domain
            - github.com/tamaco489/aozora-park/backend/internal/platform
          deny:
            - pkg: github.com/tamaco489/aozora-park/backend/internal
              desc: 実装するインタフェースは domain/repository にある
            - pkg: github.com/tamaco489/aozora-park/backend/gen
              desc: 入出力の変換は handler の仕事
            - pkg: connectrpc.com/connect
              desc: SDK のエラーは domain のセンチネルに翻訳する

        park-handler:
          list-mode: lax
          files:
            - "**/internal/park/handler/**"
          allow:
            - github.com/tamaco489/aozora-park/backend/internal/park/domain
            - github.com/tamaco489/aozora-park/backend/internal/park/usecase
            - github.com/tamaco489/aozora-park/backend/internal/platform
          deny:
            - pkg: github.com/tamaco489/aozora-park/backend/internal
              desc: handler は infrastructure を直接呼ばず usecase を通す
            - pkg: cloud.google.com/go/firestore
              desc: 永続化の相手を知るのは infrastructure だけ

        # 機能パッケージのルートだけが自分の4層を結線する
        park-root:
          list-mode: lax
          files:
            - "**/internal/park/*.go"
          allow:
            - github.com/tamaco489/aozora-park/backend/internal/park
            - github.com/tamaco489/aozora-park/backend/internal/platform
          deny:
            - pkg: github.com/tamaco489/aozora-park/backend/internal
              desc: 機能パッケージ同士は import しない

        platform:
          list-mode: lax
          files:
            - "**/internal/platform/**"
          allow:
            - github.com/tamaco489/aozora-park/backend/internal/platform
          deny:
            - pkg: github.com/tamaco489/aozora-park/backend/internal
              desc: platform は機能に依存しない

        # interceptor のテストは検査の対象に実在する proto の型が要るため、gen の禁止は実装だけに掛ける
        platform-impl:
          list-mode: lax
          files:
            - "**/internal/platform/**"
            - "!$test"
          deny:
            - pkg: github.com/tamaco489/aozora-park/backend/gen
              desc: platform は特定のサービスの定義を知らない

        # 場所を問わず入れないもの
        everywhere:
          list-mode: lax
          files:
            - $all
          deny:
            - pkg: github.com/stretchr/testify
              desc: アサーションライブラリを入れない、if と t.Errorf で書く
            - pkg: go.uber.org/fx
              desc: 依存は手書きのコンストラクタで組み立てる
            - pkg: go.uber.org/dig
              desc: 依存は手書きのコンストラクタで組み立てる

        # テストの道具を実装に持ち込まない
        impl:
          list-mode: lax
          files:
            - "!$test"
          deny:
            - pkg: github.com/google/go-cmp
              desc: cmp はテスト専用、未公開フィールドがあると panic する

  # exclusions は禁止に例外を作る (理由は個々のエントリの上に書く)
  exclusions:
    rules:
      # 環境変数を読む唯一の場所
      - path: internal/platform/config/
        linters:
          - forbidigo
        text: os\.(Getenv|LookupEnv)
      # DOCKER_TESTS はエミュレータを起こすかの判定で、業務の設定ではない
      - path: internal/platform/client/firestore/firestoretest/
        linters:
          - forbidigo
        text: os\.(Getenv|LookupEnv)

# issues は linter が見つけた指摘をどこまで出すかを決める、既定値をそのまま書いて打ち切りの件数を見えるようにする
issues:
  # 1つの linter で50件を超えると残りは表示されない
  max-issues-per-linter: 50
  # 同じ内容の指摘で3件を超えると残りは表示されない
  max-same-issues: 3
