# リポジトリのルートを作業ディレクトリとして実行する
# stg は Developer Connect の git repository link から gcloud builds submit で、prd はタグのトリガで同じファイルを使う
# 実行する SA はファイルに書かず、トリガか --service-account で渡す

# env・SA・スケールは Terraform が管理するため、deploy は image だけを差し替える
steps:
  # _TAG を渡し忘れると不正なタグで build が失敗し原因がわかりにくいため、最初に検査して止める
  - id: check
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - test -n "${_TAG}" || { echo "_TAG を --substitutions で指定する" >&2; exit 1; }

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=backend/Dockerfile
      - --build-arg=SERVICE=${_SERVICE}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${_TAG}
      - backend

  # deploy でタグではなく digest を指定するため、push した結果から digest 付きの名前を取り出して後続に渡す
  - id: push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - >-
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${_TAG}
        && docker inspect --format='{{index .RepoDigests 0}}'
        ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${_TAG}
        > /workspace/image_digest.txt

  # タグは付け直せるため、実際に push した中身を digest で固定して deploy する
  # gcloud の挙動がイメージの更新で変わらないよう、バージョンを固定する
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:585.0.0-slim
    entrypoint: bash
    args:
      - -c
      - gcloud run deploy ${_SERVICE} --image="$$(cat /workspace/image_digest.txt)" --region=${_REGION}

# _TAG は空を既定にして check で止める、未指定のまま latest のような曖昧なタグで push させないため
# stg は --substitutions=_TAG=<コミット SHA>、prd のトリガは _TAG=$TAG_NAME を渡す
substitutions:
  _REGION: asia-northeast1
  _REPOSITORY: aozora-park
  _SERVICE: api
  _TAG: ""

# 既定の 10 分では go mod download とビルドに余裕が無いため、想定する上限を明示する
timeout: 900s

options:
  # ユーザー指定の SA で実行するときは、ログの保存先を指定しないとビルドが開始できない
  logging: CLOUD_LOGGING_ONLY
