<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="740" viewBox="0 0 1500 740" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <rect width="1500" height="740" fill="#ffffff"/>

  <text x="30" y="46" font-size="25" font-weight="bold" fill="#222">GitHub Actions が「自分が何者か」を Google Cloud に納得させる 2 通りのやり方</text>
  <text x="30" y="78" font-size="15" fill="#555">Workload Identity Federation は、上の考え方を下の考え方に置き換える仕組み</text>

  <!-- 従来 -->
  <rect x="30" y="105" width="1440" height="245" rx="12" fill="#fdf7f5" stroke="#a0461b" stroke-width="2"/>

  <rect x="55" y="135" width="175" height="185" rx="8" fill="#a0461b" stroke="none"/>
  <text x="142" y="202" font-size="20" font-weight="bold" text-anchor="middle" fill="#fff">従来</text>
  <text x="142" y="243" font-size="15" text-anchor="middle" fill="#fff">秘密を</text>
  <text x="142" y="268" font-size="15" text-anchor="middle" fill="#fff">共有する</text>

  <rect x="270" y="145" width="285" height="165" rx="8" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="412" y="178" font-size="17" font-weight="bold" text-anchor="middle" fill="#222">GitHub Actions</text>
  <rect x="330" y="196" width="165" height="44" rx="6" fill="#fce8e6" stroke="#c5221f" stroke-width="1.5"/>
  <text x="412" y="224" font-size="16" font-weight="bold" text-anchor="middle" fill="#c5221f">鍵 (JSON)</text>
  <text x="412" y="266" font-size="14" text-anchor="middle" fill="#555">Secrets に保管しておく</text>
  <text x="412" y="291" font-size="14" text-anchor="middle" fill="#555">失効しない</text>

  <rect x="705" y="145" width="285" height="165" rx="8" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="847" y="178" font-size="17" font-weight="bold" text-anchor="middle" fill="#222">Google Cloud</text>
  <rect x="765" y="196" width="165" height="44" rx="6" fill="#fce8e6" stroke="#c5221f" stroke-width="1.5"/>
  <text x="847" y="224" font-size="16" font-weight="bold" text-anchor="middle" fill="#c5221f">同じ鍵</text>
  <text x="847" y="266" font-size="14" text-anchor="middle" fill="#555">見せられた鍵と照合し</text>
  <text x="847" y="291" font-size="14" text-anchor="middle" fill="#555">一致したら本人と見なす</text>

  <rect x="1040" y="160" width="400" height="135" rx="8" fill="#fff" stroke="#a0461b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1240" y="196" font-size="17" font-weight="bold" text-anchor="middle" fill="#a0461b">同じ秘密が 2 か所にある</text>
  <text x="1240" y="228" font-size="14" text-anchor="middle" fill="#555">片方が漏れれば、それだけで成立してしまう</text>
  <text x="1240" y="254" font-size="14" text-anchor="middle" fill="#555">漏れたかどうかを知る手段が無く</text>
  <text x="1240" y="278" font-size="14" text-anchor="middle" fill="#555">気をつける以外の打ち手が無い</text>

  <!-- WIF -->
  <rect x="30" y="380" width="1440" height="265" rx="12" fill="#f7f9ff" stroke="#1a4f8b" stroke-width="2"/>

  <rect x="55" y="410" width="175" height="205" rx="8" fill="#1a4f8b" stroke="none"/>
  <text x="142" y="482" font-size="20" font-weight="bold" text-anchor="middle" fill="#fff">WIF</text>
  <text x="142" y="523" font-size="15" text-anchor="middle" fill="#fff">身元を</text>
  <text x="142" y="548" font-size="15" text-anchor="middle" fill="#fff">証明させる</text>

  <rect x="270" y="420" width="210" height="185" rx="8" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="375" y="453" font-size="17" font-weight="bold" text-anchor="middle" fill="#222">GitHub Actions</text>
  <rect x="300" y="471" width="150" height="44" rx="6" fill="#f1f3f4" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="375" y="499" font-size="15" font-weight="bold" text-anchor="middle" fill="#777">鍵を持たない</text>
  <text x="375" y="541" font-size="14" text-anchor="middle" fill="#555">Secrets に置くものが</text>
  <text x="375" y="565" font-size="14" text-anchor="middle" fill="#555">1 つも無い</text>

  <rect x="530" y="420" width="190" height="185" rx="8" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="625" y="453" font-size="17" font-weight="bold" text-anchor="middle" fill="#222">発行者</text>
  <text x="625" y="481" font-size="14" text-anchor="middle" fill="#555">GitHub</text>
  <line x1="550" y1="496" x2="700" y2="496" stroke="#ddd" stroke-width="1"/>
  <text x="625" y="522" font-size="14" text-anchor="middle" fill="#333">そのジョブ専用の</text>
  <text x="625" y="546" font-size="14" text-anchor="middle" fill="#333">証明書に署名する</text>
  <text x="625" y="576" font-size="13" text-anchor="middle" fill="#555">数分で失効する</text>

  <rect x="800" y="420" width="190" height="185" rx="8" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="895" y="453" font-size="17" font-weight="bold" text-anchor="middle" fill="#222">Google Cloud</text>
  <rect x="820" y="471" width="150" height="44" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="895" y="499" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a73e8">公開鍵</text>
  <text x="895" y="541" font-size="14" text-anchor="middle" fill="#555">署名をその場で検証する</text>
  <text x="895" y="565" font-size="14" text-anchor="middle" fill="#555">発行者から取得できる</text>

  <rect x="1040" y="435" width="400" height="155" rx="8" fill="#fff" stroke="#1a4f8b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1240" y="471" font-size="17" font-weight="bold" text-anchor="middle" fill="#1a4f8b">秘密がどこにも無い</text>
  <text x="1240" y="503" font-size="14" text-anchor="middle" fill="#555">公開鍵は名前のとおり秘密ではなく</text>
  <text x="1240" y="527" font-size="14" text-anchor="middle" fill="#555">漏れて困るものが存在しない</text>
  <text x="1240" y="557" font-size="14" text-anchor="middle" fill="#555">証明書はジョブの実行中にしか発行されず</text>
  <text x="1240" y="581" font-size="14" text-anchor="middle" fill="#555">持ち出しても数分で使えなくなる</text>

  <!-- 矢印 -->
  <g stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="555" y1="218" x2="701" y2="218"/>
    <line x1="480" y1="512" x2="526" y2="512"/>
    <line x1="720" y1="512" x2="796" y2="512"/>
  </g>
  <text x="628" y="205" font-size="14" text-anchor="middle" fill="#333">鍵を見せる</text>
  <text x="503" y="499" font-size="13" text-anchor="middle" fill="#333">要求</text>
  <text x="758" y="480" font-size="13" text-anchor="middle" fill="#333">署名された</text>
  <text x="758" y="499" font-size="13" text-anchor="middle" fill="#333">証明書</text>

  <!-- まとめ -->
  <line x1="30" y1="680" x2="1470" y2="680" stroke="#ccc" stroke-width="1"/>
  <text x="30" y="712" font-size="17" font-weight="bold" fill="#222">やっているのは「鍵の配り方を工夫する」ことではなく、鍵そのものを無くすこと</text>
</svg>
