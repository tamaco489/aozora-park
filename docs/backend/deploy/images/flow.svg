<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <rect width="1600" height="950" fill="#ffffff"/>

  <!-- タイトル -->
  <text x="30" y="48" font-size="26" font-weight="bold" fill="#222">api のデプロイ経路 (GitHub Actions が Cloud Build を起動する)</text>

  <!-- GCP プロジェクト -->
  <rect x="560" y="85" width="1010" height="290" rx="12" fill="#f7f9ff" stroke="#4285f4" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="578" y="113" font-size="17" font-weight="bold" fill="#4285f4">GCP: stg-aozora-park</text>
  <rect x="560" y="440" width="1010" height="270" rx="12" fill="#f7f9ff" stroke="#4285f4" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="578" y="468" font-size="17" font-weight="bold" fill="#4285f4">GCP: prd-aozora-park</text>

  <!-- stg の起点 -->
  <rect x="30" y="115" width="230" height="130" rx="8" fill="#eaf2fb" stroke="#1a4f8b" stroke-width="1.5"/>
  <text x="145" y="143" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a4f8b">stg の起点</text>
  <text x="145" y="172" font-size="14" text-anchor="middle" fill="#333">main への push (backend/**)</text>
  <text x="145" y="197" font-size="14" text-anchor="middle" fill="#333">workflow_dispatch</text>
  <text x="145" y="222" font-size="14" text-anchor="middle" fill="#333">手元の just deploy-stg</text>

  <!-- 起動する側 -->
  <rect x="300" y="105" width="250" height="150" rx="8" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <text x="425" y="135" font-size="17" font-weight="bold" text-anchor="middle" fill="#222">起動する側</text>
  <line x1="320" y1="150" x2="530" y2="150" stroke="#ddd" stroke-width="1"/>
  <text x="425" y="175" font-size="14" text-anchor="middle" fill="#333">GitHub Actions</text>
  <text x="425" y="198" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">cd-backend-stg</text>
  <text x="425" y="221" font-size="13" text-anchor="middle" fill="#555">WIF で sa-cd-backend を借りる</text>
  <text x="425" y="244" font-size="13" text-anchor="middle" fill="#555">手元のときはユーザーの gcloud</text>

  <!-- GitHub -->
  <rect x="300" y="300" width="250" height="110" rx="8" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
  <text x="425" y="335" font-size="19" font-weight="bold" text-anchor="middle" fill="#222">GitHub</text>
  <text x="425" y="363" font-size="14" text-anchor="middle" fill="#555">tamaco489/aozora-park</text>
  <text x="425" y="389" font-size="14" text-anchor="middle" fill="#555">ソースはここから取得される</text>

  <!-- prd の起点 -->
  <rect x="30" y="555" width="230" height="100" rx="8" fill="#fcefe8" stroke="#a0461b" stroke-width="1.5"/>
  <text x="145" y="583" font-size="16" font-weight="bold" text-anchor="middle" fill="#a0461b">prd の起点</text>
  <text x="145" y="612" font-size="18" font-weight="bold" text-anchor="middle" fill="#222">タグの push</text>
  <text x="145" y="639" font-size="14" text-anchor="middle" fill="#555">例: api/v1.2.3</text>

  <!-- stg のリソース -->
  <rect x="600" y="270" width="210" height="85" rx="8" fill="#fff" stroke="#4285f4" stroke-width="2"/>
  <text x="705" y="303" font-size="16" font-weight="bold" text-anchor="middle" fill="#222">Developer Connect</text>
  <text x="705" y="330" font-size="14" text-anchor="middle" fill="#555">git repository link</text>

  <rect x="860" y="120" width="240" height="120" rx="8" fill="#fff" stroke="#4285f4" stroke-width="2"/>
  <text x="980" y="153" font-size="18" font-weight="bold" text-anchor="middle" fill="#222">Cloud Build</text>
  <text x="980" y="181" font-size="14" text-anchor="middle" fill="#555">build → push → deploy</text>
  <text x="980" y="207" font-size="14" text-anchor="middle" fill="#555">SA: sa-deployer</text>
  <text x="980" y="230" font-size="13" text-anchor="middle" fill="#555">backend/cloudbuild.yaml</text>

  <rect x="1150" y="130" width="180" height="90" rx="8" fill="#fff" stroke="#4285f4" stroke-width="2"/>
  <text x="1240" y="167" font-size="17" font-weight="bold" text-anchor="middle" fill="#222">Artifact Registry</text>
  <text x="1240" y="194" font-size="14" text-anchor="middle" fill="#555">aozora-park/api</text>

  <rect x="1380" y="130" width="170" height="90" rx="8" fill="#fff" stroke="#4285f4" stroke-width="2"/>
  <text x="1465" y="167" font-size="17" font-weight="bold" text-anchor="middle" fill="#222">Cloud Run api</text>
  <text x="1465" y="194" font-size="14" text-anchor="middle" fill="#555">SA: sa-api</text>

  <!-- prd のリソース -->
  <rect x="600" y="470" width="210" height="85" rx="8" fill="#fff" stroke="#4285f4" stroke-width="2"/>
  <text x="705" y="503" font-size="16" font-weight="bold" text-anchor="middle" fill="#222">Developer Connect</text>
  <text x="705" y="530" font-size="14" text-anchor="middle" fill="#555">git repository link</text>

  <rect x="860" y="560" width="240" height="120" rx="8" fill="#fff" stroke="#4285f4" stroke-width="2"/>
  <text x="980" y="593" font-size="18" font-weight="bold" text-anchor="middle" fill="#222">Cloud Build</text>
  <text x="980" y="621" font-size="14" text-anchor="middle" fill="#555">タグのトリガ (^api/v&lt;x.y.z&gt;$)</text>
  <text x="980" y="647" font-size="14" text-anchor="middle" fill="#555">承認が必須</text>
  <text x="980" y="670" font-size="13" text-anchor="middle" fill="#555">build → push → deploy</text>

  <rect x="1150" y="575" width="180" height="90" rx="8" fill="#fff" stroke="#4285f4" stroke-width="2"/>
  <text x="1240" y="612" font-size="17" font-weight="bold" text-anchor="middle" fill="#222">Artifact Registry</text>
  <text x="1240" y="639" font-size="14" text-anchor="middle" fill="#555">aozora-park/api</text>

  <rect x="1380" y="575" width="170" height="90" rx="8" fill="#fff" stroke="#4285f4" stroke-width="2"/>
  <text x="1465" y="612" font-size="17" font-weight="bold" text-anchor="middle" fill="#222">Cloud Run api</text>
  <text x="1465" y="639" font-size="14" text-anchor="middle" fill="#555">SA: sa-api</text>

  <!-- 矢印 -->
  <g stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="260" y1="180" x2="296" y2="180"/>
    <line x1="550" y1="180" x2="856" y2="180"/>
    <path d="M 550 350 C 570 350, 575 313, 596 313"/>
    <path d="M 810 300 C 845 300, 850 270, 870 246"/>
    <path d="M 145 551 C 145 460, 300 430, 420 414"/>
    <path d="M 550 380 C 580 380, 575 513, 596 513"/>
    <path d="M 810 513 C 840 513, 840 580, 856 595"/>
    <line x1="1100" y1="175" x2="1146" y2="175"/>
    <line x1="1330" y1="175" x2="1376" y2="175"/>
    <line x1="1100" y1="620" x2="1146" y2="620"/>
    <line x1="1330" y1="620" x2="1376" y2="620"/>
  </g>

  <!-- 矢印のラベル -->
  <text x="703" y="164" font-size="14" text-anchor="middle" fill="#333">gcloud beta builds submit --revision=&lt;SHA&gt;</text>
  <text x="703" y="202" font-size="13" text-anchor="middle" fill="#555">ビルドを起こすだけ。中身は GCP の中で動く</text>
  <text x="836" y="280" font-size="13" fill="#333">ソースを取得</text>
  <text x="836" y="492" font-size="13" fill="#333">起動・取得</text>
  <text x="290" y="470" font-size="14" fill="#333">git push (tag)</text>
  <text x="1123" y="163" font-size="13" text-anchor="middle" fill="#333">push</text>
  <text x="1353" y="163" font-size="13" text-anchor="middle" fill="#333">deploy</text>
  <text x="1123" y="608" font-size="13" text-anchor="middle" fill="#333">push</text>
  <text x="1353" y="608" font-size="13" text-anchor="middle" fill="#333">deploy</text>

  <!-- 注記 -->
  <line x1="30" y1="745" x2="1570" y2="745" stroke="#ccc" stroke-width="1"/>
  <text x="30" y="777" font-size="15" fill="#333">・stg は main への push で cd-backend-stg が起動する。workflow_dispatch と手元の just deploy-stg でも同じコマンドを投げるため、経路は 1 本しかない</text>
  <text x="30" y="805" font-size="15" fill="#333">・GitHub Actions が行うのは Cloud Build の起動だけ。build → push → deploy は sa-deployer が GCP の中で実行し、デプロイの権限を GitHub 側に出さない</text>
  <text x="30" y="833" font-size="15" fill="#333">・認証は Workload Identity Federation。GitHub Secrets に長期クレデンシャルを置かない。sa-cd-backend が持つのはビルドの起動とログの参照だけ</text>
  <text x="30" y="861" font-size="15" fill="#333">・どちらも同じ backend/cloudbuild.yaml を使う。イメージのタグはコミットの SHA。Cloud Run の image 以外は Terraform が管理する (ignore_changes)</text>
  <text x="30" y="889" font-size="15" fill="#333">・prd のトリガは承認を必須にしている。タグを push しただけではビルドは始まらない。prd の GCP プロジェクトは現時点では未作成 (定義のみ)</text>
  <text x="30" y="917" font-size="15" fill="#333">・prd には WIF を置いていない。配信方法が未定で、attribute_condition の絞り方を決められないため</text>
</svg>
