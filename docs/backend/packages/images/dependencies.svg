<text x="1220" y="162" font-size="18" text-anchor="middle">Application Business Rules</text>
<rect x="1060" y="184" width="320" height="40" rx="10" fill="#fff3bf" stroke="#b45309" stroke-width="2"/>
<text x="1220" y="210" font-size="18" text-anchor="middle">Enterprise Business Rules</text>

<text x="400" y="770" font-size="18" fill="#757575">機能パッケージは park ・ inventory ・ prioritypass の 3 つで、どれも同じ形をとる</text>
<text x="400" y="800" font-size="18" fill="#757575">infrastructure/pubsub と usecase/port を持つのは prioritypass だけ</text>
<text x="400" y="830" font-size="18" fill="#757575">infrastructure が repository を知り、usecase は実装を知らない</text>
<text x="400" y="860" font-size="18" fill="#757575">3 層すべてを知るのは internal/&lt;機能&gt; の組み立てだけ</text>
<text x="400" y="890" font-size="18" fill="#757575">apperr は platform の下にあるが、model が使うので依存では中心</text>
