openapi: 3.1.0
info:
  title: API
  description: API documentation for API
  version: 1.0.0
paths:
  /aozorapark.inventory.v1.InventoryService/GetDateInventory:
    post:
      tags:
        - InventoryService
      summary: GetDateInventory
      description: GetDateInventory は特定の日の入場枠を 1 件取得する
      operationId: aozorapark.inventory.v1.InventoryService.GetDateInventory
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aozorapark.inventory.v1.GetDateInventoryRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aozorapark.inventory.v1.GetDateInventoryResponse'
  /aozorapark.inventory.v1.InventoryService/ListTimeSlots:
    post:
      tags:
        - InventoryService
      summary: ListTimeSlots
      description: ListTimeSlots はアトラクションの特定の日の時間帯枠を開始時刻の昇順で取得する
      operationId: aozorapark.inventory.v1.InventoryService.ListTimeSlots
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aozorapark.inventory.v1.ListTimeSlotsRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aozorapark.inventory.v1.ListTimeSlotsResponse'
  /aozorapark.inventory.v1.InventoryService/UpdateDateInventory:
    post:
      tags:
        - InventoryService
      summary: UpdateDateInventory
      description: UpdateDateInventory は運営が特定の日の上限人数と残りの人数を上書きする
      operationId: aozorapark.inventory.v1.InventoryService.UpdateDateInventory
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aozorapark.inventory.v1.UpdateDateInventoryRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aozorapark.inventory.v1.UpdateDateInventoryResponse'
  /aozorapark.park.v1.ParkService/CreatePark:
    post:
      tags:
        - ParkService
      summary: CreatePark
      description: CreatePark はパークを新しく登録する
      operationId: aozorapark.park.v1.ParkService.CreatePark
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aozorapark.park.v1.CreateParkRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aozorapark.park.v1.CreateParkResponse'
  /aozorapark.park.v1.ParkService/GetPark:
    post:
      tags:
        - ParkService
      summary: GetPark
      description: GetPark はパークを 1 件取得する
      operationId: aozorapark.park.v1.ParkService.GetPark
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aozorapark.park.v1.GetParkRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aozorapark.park.v1.GetParkResponse'
  /aozorapark.park.v1.ParkService/UpdatePark:
    post:
      tags:
        - ParkService
      summary: UpdatePark
      description: UpdatePark は表示名と枠の生成に使う初期値を更新する
      operationId: aozorapark.park.v1.ParkService.UpdatePark
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aozorapark.park.v1.UpdateParkRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aozorapark.park.v1.UpdateParkResponse'
components:
  schemas:
    aozorapark.inventory.v1.DateInventory:
      type: object
      properties:
        parkId:
          type: string
          title: park_id
          description: park_id は枠が属するパークの識別子
        date:
          type: string
          title: date
          description: date は枠の日付、YYYY-MM-DD
        capacity:
          type: integer
          title: capacity
          format: int32
          description: capacity はその日に受け入れる上限人数、単位は人
        remaining:
          type: integer
          title: remaining
          format: int32
          description: remaining はその日の残りの人数、単位は人
      title: DateInventory
      additionalProperties: false
      description: DateInventory はパークの特定の日の入場枠
    aozorapark.inventory.v1.GetDateInventoryRequest:
      type: object
      properties:
        parkId:
          type: string
          title: park_id
          minLength: 1
          description: park_id は枠が属するパークの識別子
        date:
          type: string
          title: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          description: date は取得する枠の日付、YYYY-MM-DD
      title: GetDateInventoryRequest
      additionalProperties: false
    aozorapark.inventory.v1.GetDateInventoryResponse:
      type: object
      properties:
        dateInventory:
          allOf:
            - $ref: '#/components/schemas/aozorapark.inventory.v1.DateInventory'
          title: date_inventory
          description: date_inventory は取得した入場枠
      title: GetDateInventoryResponse
      additionalProperties: false
    aozorapark.inventory.v1.ListTimeSlotsRequest:
      type: object
      properties:
        parkId:
          type: string
          title: park_id
          minLength: 1
          description: park_id は枠が属するパークの識別子
        attractionId:
          type: string
          title: attraction_id
          minLength: 1
          description: attraction_id は枠が属するアトラクションの識別子
        date:
          type: string
          title: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          description: date は取得する枠の日付、YYYY-MM-DD
      title: ListTimeSlotsRequest
      additionalProperties: false
    aozorapark.inventory.v1.ListTimeSlotsResponse:
      type: object
      properties:
        timeSlots:
          type: array
          items:
            $ref: '#/components/schemas/aozorapark.inventory.v1.TimeSlot'
          title: time_slots
          description: time_slots は開始時刻の昇順に並んだ時間帯枠、1 日分のため件数の上限は設けない
      title: ListTimeSlotsResponse
      additionalProperties: false
    aozorapark.inventory.v1.TimeSlot:
      type: object
      properties:
        parkId:
          type: string
          title: park_id
          description: park_id は枠が属するパークの識別子
        attractionId:
          type: string
          title: attraction_id
          description: attraction_id は枠が属するアトラクションの識別子
        timeSlotId:
          type: string
          title: time_slot_id
          description: time_slot_id は時間帯枠の識別子、YYYYMMDD_HHMM の形
        date:
          type: string
          title: date
          description: date は枠の日付、YYYY-MM-DD
        startTime:
          type: string
          title: start_time
          description: start_time は枠の開始時刻、HH:MM
        capacity:
          type: integer
          title: capacity
          format: int32
          description: capacity はその時間帯に発行する上限枚数、単位は枚
        remaining:
          type: integer
          title: remaining
          format: int32
          description: remaining はその時間帯の残りの枚数、単位は枚
      title: TimeSlot
      additionalProperties: false
      description: TimeSlot はアトラクションの時間帯ごとの枠
    aozorapark.inventory.v1.UpdateDateInventoryRequest:
      type: object
      properties:
        parkId:
          type: string
          title: park_id
          minLength: 1
          description: park_id は枠が属するパークの識別子
        date:
          type: string
          title: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          description: date は上書きする枠の日付、YYYY-MM-DD
        capacity:
          type: integer
          title: capacity
          minimum: 1
          format: int32
          description: capacity はその日に受け入れる上限人数、単位は人
        remaining:
          type: integer
          title: remaining
          minimum: 0
          format: int32
          description: remaining はその日の残りの人数、単位は人、上限人数を超えないことは枠そのものが判断する
      title: UpdateDateInventoryRequest
      additionalProperties: false
    aozorapark.inventory.v1.UpdateDateInventoryResponse:
      type: object
      properties:
        dateInventory:
          allOf:
            - $ref: '#/components/schemas/aozorapark.inventory.v1.DateInventory'
          title: date_inventory
          description: date_inventory は上書き後の入場枠
      title: UpdateDateInventoryResponse
      additionalProperties: false
    aozorapark.park.v1.CreateParkRequest:
      type: object
      properties:
        name:
          type: string
          title: name
          maxLength: 100
          minLength: 1
          description: name はパークの表示名、100 文字の上限は一覧や通知での表示が壊れないための歯止め
        defaultDailyCapacity:
          exclusiveMinimum: 0
          type: integer
          title: default_daily_capacity
          format: int32
          description: default_daily_capacity は 1 日あたりの上限人数の初期値、単位は人
        inventoryDays:
          type: integer
          title: inventory_days
          maximum: 90
          minimum: 1
          format: int32
          description: inventory_days は入場枠を先行して生成する日数、90 日の上限は枠の生成が際限なく膨らまないための歯止め
      title: CreateParkRequest
      additionalProperties: false
    aozorapark.park.v1.CreateParkResponse:
      type: object
      properties:
        park:
          allOf:
            - $ref: '#/components/schemas/aozorapark.park.v1.Park'
          title: park
          description: park は登録されたパーク
      title: CreateParkResponse
      additionalProperties: false
    aozorapark.park.v1.GetParkRequest:
      type: object
      properties:
        parkId:
          type: string
          title: park_id
          minLength: 1
          description: park_id は取得するパークの識別子
      title: GetParkRequest
      additionalProperties: false
    aozorapark.park.v1.GetParkResponse:
      type: object
      properties:
        park:
          allOf:
            - $ref: '#/components/schemas/aozorapark.park.v1.Park'
          title: park
          description: park は取得したパーク
      title: GetParkResponse
      additionalProperties: false
    aozorapark.park.v1.Park:
      type: object
      properties:
        parkId:
          type: string
          title: park_id
          description: park_id はパークの識別子
        name:
          type: string
          title: name
          description: name はパークの表示名
        defaultDailyCapacity:
          type: integer
          title: default_daily_capacity
          format: int32
          description: default_daily_capacity は入場枠を生成するときの 1 日あたりの上限人数の初期値
        inventoryDays:
          type: integer
          title: inventory_days
          format: int32
          description: inventory_days は入場枠を先行して生成する日数
      title: Park
      additionalProperties: false
      description: Park は来園予約の最上位となるパーク
    aozorapark.park.v1.UpdateParkRequest:
      type: object
      properties:
        parkId:
          type: string
          title: park_id
          minLength: 1
          description: park_id は更新するパークの識別子
        name:
          type: string
          title: name
          maxLength: 100
          minLength: 1
          description: name はパークの表示名、100 文字の上限は一覧や通知での表示が壊れないための歯止め
        defaultDailyCapacity:
          exclusiveMinimum: 0
          type: integer
          title: default_daily_capacity
          format: int32
          description: default_daily_capacity は 1 日あたりの上限人数の初期値、単位は人
        inventoryDays:
          type: integer
          title: inventory_days
          maximum: 90
          minimum: 1
          format: int32
          description: inventory_days は入場枠を先行して生成する日数、90 日の上限は枠の生成が際限なく膨らまないための歯止め
      title: UpdateParkRequest
      additionalProperties: false
    aozorapark.park.v1.UpdateParkResponse:
      type: object
      properties:
        park:
          allOf:
            - $ref: '#/components/schemas/aozorapark.park.v1.Park'
          title: park
          description: park は更新後のパーク
      title: UpdateParkResponse
      additionalProperties: false
    connect-protocol-version:
      type: number
      examples:
        - 1
      title: Connect-Protocol-Version
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      examples:
        - 1000
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`.'
        value:
          type: string
          format: binary
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          type: object
          title: Debug
          additionalProperties: true
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
security: []
tags:
  - name: InventoryService
    description: |-
      InventoryService は入場枠と時間帯枠を参照し、特定の日の入場枠を上書きする

       枠の作成は専用のジョブが行うため、この service は持たない
  - name: ParkService
    description: ParkService はパークのマスタを操作する
