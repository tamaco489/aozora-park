openapi: 3.1.0
info:
  title: API
  description: API documentation for API
  version: 1.0.0
paths:
  /aozorapark.park.v1.ParkService/CreateAttraction:
    post:
      tags:
        - ParkService
      summary: CreateAttraction
      description: CreateAttraction はパークにアトラクションを新しく登録する
      operationId: aozorapark.park.v1.ParkService.CreateAttraction
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aozorapark.park.v1.CreateAttractionRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aozorapark.park.v1.CreateAttractionResponse'
