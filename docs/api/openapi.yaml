      enum:
        - PRIORITY_PASS_STATUS_UNSPECIFIED
        - PRIORITY_PASS_STATUS_REQUESTED
        - PRIORITY_PASS_STATUS_ISSUED
        - PRIORITY_PASS_STATUS_SOLD_OUT
      description: |-
        PriorityPassStatus は優先パスの状態

         却下を表す REJECTED は、券との突き合わせを行う tickets ができたときに足す
    aozorapark.prioritypass.v1.RequestPriorityPassRequest:
      type: object
