        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aozorapark.park.v1.GetParkResponse'
  /aozorapark.park.v1.ParkService/UpdateAttraction:
    post:
      tags:
        - ParkService
      summary: UpdateAttraction
      description: UpdateAttraction は表示名と優先パスの条件を更新する
      operationId: aozorapark.park.v1.ParkService.UpdateAttraction
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          required: true
