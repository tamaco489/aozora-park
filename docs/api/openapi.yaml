        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aozorapark.park.v1.UpdateParkResponse'
  /aozorapark.park.v1.ParkService/UpdateTicketType:
    post:
      tags:
        - ParkService
      summary: UpdateTicketType
      description: UpdateTicketType は表示名と価格と入場できる時間帯を更新する
      operationId: aozorapark.park.v1.ParkService.UpdateTicketType
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
