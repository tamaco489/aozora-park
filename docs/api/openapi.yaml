          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aozorapark.park.v1.CreateParkRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aozorapark.park.v1.CreateParkResponse'
  /aozorapark.park.v1.ParkService/CreateTicketType:
    post:
      tags:
