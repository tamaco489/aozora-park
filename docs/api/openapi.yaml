components:
  schemas:
    aozorapark.park.v1.Attraction:
      type: object
      properties:
        attractionId:
          type: string
          title: attraction_id
          description: attraction_id はアトラクションの識別子
        parkId:
          type: string
          title: park_id
          description: park_id は属するパークの識別子
        name:
          type: string
          title: name
          description: name はアトラクションの表示名
        priorityPassConfig:
          allOf:
            - $ref: '#/components/schemas/aozorapark.park.v1.PriorityPassConfig'
          title: priority_pass_config
          description: priority_pass_config は優先パスの時間帯枠を生成する条件
      title: Attraction
      additionalProperties: false
      description: Attraction はパークに属するアトラクション
    aozorapark.park.v1.CreateAttractionRequest:
      type: object
      properties:
        parkId:
          type: string
          title: park_id
          minLength: 1
          description: park_id はアトラクションを登録するパークの識別子
        name:
          type: string
          title: name
          maxLength: 100
          minLength: 1
          description: name はアトラクションの表示名、100 文字の上限は一覧や通知での表示が壊れないための歯止め
        enabled:
          type: boolean
          title: enabled
          description: enabled はアトラクションが優先パスの対象かどうか
        startTime:
          type: string
          title: start_time
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: start_time は時間帯枠を生成しはじめる時刻、無効でも後から有効にするため常に妥当な値を求める
        endTime:
          type: string
          title: end_time
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: end_time は時間帯枠の生成を終える時刻、start_time より後であることは usecase を通さない経路もあるため domain/model が判断する
        intervalMinutes:
          type: integer
          title: interval_minutes
          minimum: 1
          format: int32
          description: interval_minutes は時間帯枠を刻む間隔、単位は分
        capacityPerSlot:
          type: integer
          title: capacity_per_slot
          minimum: 1
          format: int32
          description: capacity_per_slot は時間帯枠 1 つあたりに発行できる優先パスの上限、単位は枚
      title: CreateAttractionRequest
      additionalProperties: false
    aozorapark.park.v1.CreateAttractionResponse:
      type: object
      properties:
        attraction:
          allOf:
            - $ref: '#/components/schemas/aozorapark.park.v1.Attraction'
          title: attraction
          description: attraction は登録されたアトラクション
      title: CreateAttractionResponse
      additionalProperties: false
    aozorapark.park.v1.CreateParkRequest:
      type: object
      properties:
        name:
          type: string
          title: name
          maxLength: 100
          minLength: 1
          description: name はパークの表示名、100 文字の上限は一覧や通知での表示が壊れないための歯止め
        defaultDailyCapacity:
          exclusiveMinimum: 0
          type: integer
          title: default_daily_capacity
          format: int32
          description: default_daily_capacity は 1 日あたりの上限人数の初期値、単位は人
        inventoryDays:
          type: integer
          title: inventory_days
          maximum: 90
          minimum: 1
          format: int32
          description: inventory_days は入場枠を先行して生成する日数、90 日の上限は枠の生成が際限なく膨らまないための歯止め
      title: CreateParkRequest
      additionalProperties: false
    aozorapark.park.v1.CreateParkResponse:
      type: object
      properties:
        park:
          allOf:
            - $ref: '#/components/schemas/aozorapark.park.v1.Park'
          title: park
          description: park は登録されたパーク
      title: CreateParkResponse
      additionalProperties: false
    aozorapark.park.v1.CreateTicketTypeRequest:
      type: object
      properties:
        parkId:
          type: string
          title: park_id
          minLength: 1
          description: park_id は券種を登録するパークの識別子
        name:
          type: string
          title: name
          maxLength: 100
          minLength: 1
          description: name は券種の表示名、100 文字の上限は一覧や通知での表示が壊れないための歯止め
        price:
          type: string
          title: price
          minimum: 0
          format: int64
          description: price は販売価格、単位は円、無料の券種があるため 0 を許す
        entryTimeFrom:
          type: string
          title: entry_time_from
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: entry_time_from は入場できる時間帯の開始時刻
        entryTimeTo:
          type: string
          title: entry_time_to
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: entry_time_to は入場できる時間帯の終了時刻、entry_time_from より後であることは usecase を通さない経路もあるため domain/model が判断する
      title: CreateTicketTypeRequest
      additionalProperties: false
    aozorapark.park.v1.CreateTicketTypeResponse:
      type: object
      properties:
        ticketType:
          allOf:
            - $ref: '#/components/schemas/aozorapark.park.v1.TicketType'
          title: ticket_type
          description: ticket_type は登録された券種
      title: CreateTicketTypeResponse
      additionalProperties: false
    aozorapark.park.v1.GetParkRequest:
      type: object
      properties:
        parkId:
          type: string
          title: park_id
          minLength: 1
          description: park_id は取得するパークの識別子
      title: GetParkRequest
      additionalProperties: false
    aozorapark.park.v1.GetParkResponse:
      type: object
      properties:
        park:
          allOf:
            - $ref: '#/components/schemas/aozorapark.park.v1.Park'
          title: park
          description: park は取得したパーク
      title: GetParkResponse
      additionalProperties: false
    aozorapark.park.v1.Park:
      type: object
      properties:
        parkId:
          type: string
          title: park_id
          description: park_id はパークの識別子
        name:
          type: string
          title: name
          description: name はパークの表示名
        defaultDailyCapacity:
          type: integer
          title: default_daily_capacity
          format: int32
          description: default_daily_capacity は入場枠を生成するときの 1 日あたりの上限人数の初期値
        inventoryDays:
          type: integer
          title: inventory_days
          format: int32
          description: inventory_days は入場枠を先行して生成する日数
      title: Park
      additionalProperties: false
      description: Park は来園予約の最上位となるパーク
    aozorapark.park.v1.PriorityPassConfig:
      type: object
      properties:
        enabled:
          type: boolean
          title: enabled
          description: enabled はアトラクションが優先パスの対象かどうか
        startTime:
          type: string
          title: start_time
          description: start_time は時間帯枠を生成しはじめる時刻、HH:MM の 24 時間表記
        endTime:
          type: string
          title: end_time
          description: end_time は時間帯枠の生成を終える時刻、HH:MM の 24 時間表記で start_time より後
        intervalMinutes:
          type: integer
          title: interval_minutes
          format: int32
          description: interval_minutes は時間帯枠を刻む間隔、単位は分
        capacityPerSlot:
          type: integer
          title: capacity_per_slot
          format: int32
          description: capacity_per_slot は時間帯枠 1 つあたりに発行できる優先パスの上限、単位は枚
      title: PriorityPassConfig
      additionalProperties: false
      description: PriorityPassConfig は優先パスの時間帯枠を生成する条件
    aozorapark.park.v1.TicketType:
      type: object
      properties:
        ticketTypeId:
          type: string
          title: ticket_type_id
          description: ticket_type_id は券種の識別子
        parkId:
          type: string
          title: park_id
          description: park_id は属するパークの識別子
        name:
          type: string
          title: name
          description: name は券種の表示名
        price:
          type: string
          title: price
          format: int64
          description: price は販売価格、単位は円
        entryTimeFrom:
          type: string
          title: entry_time_from
          description: entry_time_from は入場できる時間帯の開始時刻、HH:MM の 24 時間表記
        entryTimeTo:
          type: string
          title: entry_time_to
          description: entry_time_to は入場できる時間帯の終了時刻、HH:MM の 24 時間表記で entry_time_from より後
      title: TicketType
      additionalProperties: false
      description: TicketType はパークが販売する券種
    aozorapark.park.v1.UpdateAttractionRequest:
      type: object
      properties:
        parkId:
          type: string
          title: park_id
          minLength: 1
          description: park_id は属するパークの識別子
        attractionId:
          type: string
          title: attraction_id
          minLength: 1
          description: attraction_id は更新するアトラクションの識別子
        name:
          type: string
          title: name
          maxLength: 100
          minLength: 1
          description: name はアトラクションの表示名、100 文字の上限は一覧や通知での表示が壊れないための歯止め
        enabled:
          type: boolean
          title: enabled
          description: enabled はアトラクションが優先パスの対象かどうか
        startTime:
          type: string
          title: start_time
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: start_time は時間帯枠を生成しはじめる時刻、無効でも後から有効にするため常に妥当な値を求める
        endTime:
          type: string
          title: end_time
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: end_time は時間帯枠の生成を終える時刻、start_time より後であることは usecase を通さない経路もあるため domain/model が判断する
        intervalMinutes:
          type: integer
          title: interval_minutes
          minimum: 1
          format: int32
          description: interval_minutes は時間帯枠を刻む間隔、単位は分
        capacityPerSlot:
          type: integer
          title: capacity_per_slot
          minimum: 1
          format: int32
          description: capacity_per_slot は時間帯枠 1 つあたりに発行できる優先パスの上限、単位は枚
      title: UpdateAttractionRequest
      additionalProperties: false
    aozorapark.park.v1.UpdateAttractionResponse:
      type: object
      properties:
        attraction:
          allOf:
            - $ref: '#/components/schemas/aozorapark.park.v1.Attraction'
          title: attraction
          description: attraction は更新後のアトラクション
      title: UpdateAttractionResponse
      additionalProperties: false
    aozorapark.park.v1.UpdateParkRequest:
      type: object
      properties:
        parkId:
          type: string
          title: park_id
          minLength: 1
          description: park_id は更新するパークの識別子
        name:
          type: string
          title: name
          maxLength: 100
          minLength: 1
          description: name はパークの表示名、100 文字の上限は一覧や通知での表示が壊れないための歯止め
        defaultDailyCapacity:
          exclusiveMinimum: 0
          type: integer
          title: default_daily_capacity
          format: int32
          description: default_daily_capacity は 1 日あたりの上限人数の初期値、単位は人
        inventoryDays:
          type: integer
          title: inventory_days
          maximum: 90
          minimum: 1
          format: int32
          description: inventory_days は入場枠を先行して生成する日数、90 日の上限は枠の生成が際限なく膨らまないための歯止め
      title: UpdateParkRequest
      additionalProperties: false
    aozorapark.park.v1.UpdateParkResponse:
      type: object
      properties:
        park:
          allOf:
            - $ref: '#/components/schemas/aozorapark.park.v1.Park'
          title: park
          description: park は更新後のパーク
      title: UpdateParkResponse
      additionalProperties: false
    aozorapark.park.v1.UpdateTicketTypeRequest:
      type: object
      properties:
        parkId:
          type: string
          title: park_id
          minLength: 1
          description: park_id は属するパークの識別子
        ticketTypeId:
          type: string
          title: ticket_type_id
          minLength: 1
          description: ticket_type_id は更新する券種の識別子
        name:
          type: string
          title: name
          maxLength: 100
          minLength: 1
          description: name は券種の表示名、100 文字の上限は一覧や通知での表示が壊れないための歯止め
        price:
          type: string
          title: price
          minimum: 0
          format: int64
          description: price は販売価格、単位は円、無料の券種があるため 0 を許す
        entryTimeFrom:
          type: string
          title: entry_time_from
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: entry_time_from は入場できる時間帯の開始時刻
        entryTimeTo:
          type: string
          title: entry_time_to
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: entry_time_to は入場できる時間帯の終了時刻、entry_time_from より後であることは usecase を通さない経路もあるため domain/model が判断する
      title: UpdateTicketTypeRequest
      additionalProperties: false
    aozorapark.park.v1.UpdateTicketTypeResponse:
      type: object
      properties:
        ticketType:
          allOf:
            - $ref: '#/components/schemas/aozorapark.park.v1.TicketType'
          title: ticket_type
          description: ticket_type は更新後の券種
      title: UpdateTicketTypeResponse
      additionalProperties: false
    connect-protocol-version:
      type: number
      examples:
        - 1
      title: Connect-Protocol-Version
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      examples:
        - 1000
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`.'
