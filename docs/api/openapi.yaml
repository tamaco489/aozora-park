      summary: CreateTicketType
      description: CreateTicketType はパークに券種を新しく登録する
      operationId: aozorapark.park.v1.ParkService.CreateTicketType
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aozorapark.park.v1.CreateTicketTypeRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connect.error'
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/aozorapark.park.v1.CreateTicketTypeResponse'
  /aozorapark.park.v1.ParkService/GetPark:
    post:
      tags:
        - ParkService
      summary: GetPark
      description: GetPark はパークを 1 件取得する
      operationId: aozorapark.park.v1.ParkService.GetPark
      parameters:
        - name: Connect-Protocol-Version
          in: header
          description: Define the version of the Connect protocol
          required: true
          schema:
            $ref: '#/components/schemas/connect-protocol-version'
          example: 1
        - name: Connect-Timeout-Ms
          in: header
          description: Define the timeout, in ms
          schema:
            $ref: '#/components/schemas/connect-timeout-header'
          example: 1000
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/aozorapark.park.v1.GetParkRequest'
        required: true
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
