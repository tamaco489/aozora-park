components:
  schemas:
    aozorapark.inventory.v1.DateInventory:
      type: object
      properties:
        parkId:
          type: string
          title: park_id
          description: park_id は枠が属するパークの識別子
        date:
          type: string
          title: date
          description: date は枠の日付、YYYY-MM-DD
        capacity:
          type: integer
          title: capacity
          format: int32
          description: capacity はその日に受け入れる上限人数、単位は人
        remaining:
          type: integer
          title: remaining
          format: int32
          description: remaining はその日の残りの人数、単位は人
      title: DateInventory
      additionalProperties: false
      description: DateInventory はパークの特定の日の入場枠
    aozorapark.inventory.v1.GetDateInventoryRequest:
      type: object
      properties:
        parkId:
          type: string
          title: park_id
          minLength: 1
          description: park_id は枠が属するパークの識別子
        date:
          type: string
          title: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          description: date は取得する枠の日付、YYYY-MM-DD
      title: GetDateInventoryRequest
      additionalProperties: false
    aozorapark.inventory.v1.GetDateInventoryResponse:
      type: object
      properties:
        dateInventory:
          allOf:
            - $ref: '#/components/schemas/aozorapark.inventory.v1.DateInventory'
          title: date_inventory
          description: date_inventory は取得した入場枠
      title: GetDateInventoryResponse
      additionalProperties: false
    aozorapark.inventory.v1.ListTimeSlotsRequest:
      type: object
      properties:
        parkId:
          type: string
          title: park_id
          minLength: 1
          description: park_id は枠が属するパークの識別子
        attractionId:
          type: string
          title: attraction_id
          minLength: 1
          description: attraction_id は枠が属するアトラクションの識別子
        date:
          type: string
          title: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          description: date は取得する枠の日付、YYYY-MM-DD
      title: ListTimeSlotsRequest
      additionalProperties: false
    aozorapark.inventory.v1.ListTimeSlotsResponse:
      type: object
      properties:
        timeSlots:
          type: array
          items:
            $ref: '#/components/schemas/aozorapark.inventory.v1.TimeSlot'
          title: time_slots
          description: time_slots は開始時刻の昇順に並んだ時間帯枠、1 日分のため件数の上限は設けない
      title: ListTimeSlotsResponse
      additionalProperties: false
    aozorapark.inventory.v1.TimeSlot:
      type: object
      properties:
        parkId:
          type: string
          title: park_id
          description: park_id は枠が属するパークの識別子
        attractionId:
          type: string
          title: attraction_id
          description: attraction_id は枠が属するアトラクションの識別子
        timeSlotId:
          type: string
          title: time_slot_id
          description: time_slot_id は時間帯枠の識別子、YYYYMMDD_HHMM の形
        date:
          type: string
          title: date
          description: date は枠の日付、YYYY-MM-DD
        startTime:
          type: string
          title: start_time
          description: start_time は枠の開始時刻、HH:MM
        capacity:
          type: integer
          title: capacity
          format: int32
          description: capacity はその時間帯に発行する上限枚数、単位は枚
        remaining:
          type: integer
          title: remaining
          format: int32
          description: remaining はその時間帯の残りの枚数、単位は枚
      title: TimeSlot
      additionalProperties: false
      description: TimeSlot はアトラクションの時間帯ごとの枠
    aozorapark.inventory.v1.UpdateDateInventoryRequest:
      type: object
      properties:
        parkId:
          type: string
          title: park_id
          minLength: 1
          description: park_id は枠が属するパークの識別子
        date:
          type: string
          title: date
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          description: date は上書きする枠の日付、YYYY-MM-DD
        capacity:
          type: integer
          title: capacity
          minimum: 1
          format: int32
          description: capacity はその日に受け入れる上限人数、単位は人
        remaining:
          type: integer
          title: remaining
          minimum: 0
          format: int32
          description: remaining はその日の残りの人数、単位は人、上限人数を超えないことは枠そのものが判断する
      title: UpdateDateInventoryRequest
      additionalProperties: false
    aozorapark.inventory.v1.UpdateDateInventoryResponse:
      type: object
      properties:
        dateInventory:
          allOf:
            - $ref: '#/components/schemas/aozorapark.inventory.v1.DateInventory'
          title: date_inventory
          description: date_inventory は上書き後の入場枠
      title: UpdateDateInventoryResponse
      additionalProperties: false
    aozorapark.park.v1.Attraction:
      type: object
      properties:
        attractionId:
          type: string
          title: attraction_id
          description: attraction_id はアトラクションの識別子
        parkId:
          type: string
          title: park_id
          description: park_id は属するパークの識別子
        name:
          type: string
          title: name
          description: name はアトラクションの表示名
        priorityPassConfig:
          allOf:
            - $ref: '#/components/schemas/aozorapark.park.v1.PriorityPassConfig'
          title: priority_pass_config
          description: priority_pass_config は優先パスの時間帯枠を生成する条件
      title: Attraction
      additionalProperties: false
      description: Attraction はパークに属するアトラクション
    aozorapark.park.v1.CreateAttractionRequest:
      type: object
      properties:
        parkId:
          type: string
          title: park_id
          minLength: 1
          description: park_id はアトラクションを登録するパークの識別子
        name:
          type: string
          title: name
          maxLength: 100
          minLength: 1
          description: name はアトラクションの表示名、100 文字の上限は一覧や通知での表示が壊れないための歯止め
        enabled:
          type: boolean
          title: enabled
          description: enabled はアトラクションが優先パスの対象かどうか
        startTime:
          type: string
          title: start_time
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: start_time は時間帯枠を生成しはじめる時刻、無効でも後から有効にするため常に妥当な値を求める
        endTime:
          type: string
          title: end_time
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: end_time は時間帯枠の生成を終える時刻、start_time より後であることは usecase を通さない経路もあるため domain/model が判断する
        intervalMinutes:
          type: integer
          title: interval_minutes
          minimum: 1
          format: int32
          description: interval_minutes は時間帯枠を刻む間隔、単位は分
        capacityPerSlot:
          type: integer
          title: capacity_per_slot
          minimum: 1
          format: int32
          description: capacity_per_slot は時間帯枠 1 つあたりに発行できる優先パスの上限、単位は枚
      title: CreateAttractionRequest
      additionalProperties: false
    aozorapark.park.v1.CreateAttractionResponse:
      type: object
      properties:
        attraction:
          allOf:
            - $ref: '#/components/schemas/aozorapark.park.v1.Attraction'
          title: attraction
          description: attraction は登録されたアトラクション
      title: CreateAttractionResponse
      additionalProperties: false
    aozorapark.park.v1.CreateParkRequest:
      type: object
      properties:
        name:
          type: string
          title: name
          maxLength: 100
          minLength: 1
          description: name はパークの表示名、100 文字の上限は一覧や通知での表示が壊れないための歯止め
        defaultDailyCapacity:
          exclusiveMinimum: 0
          type: integer
          title: default_daily_capacity
          format: int32
          description: default_daily_capacity は 1 日あたりの上限人数の初期値、単位は人
        inventoryDays:
          type: integer
          title: inventory_days
          maximum: 90
          minimum: 1
          format: int32
          description: inventory_days は入場枠を先行して生成する日数、90 日の上限は枠の生成が際限なく膨らまないための歯止め
      title: CreateParkRequest
      additionalProperties: false
    aozorapark.park.v1.CreateParkResponse:
      type: object
      properties:
        park:
          allOf:
            - $ref: '#/components/schemas/aozorapark.park.v1.Park'
          title: park
          description: park は登録されたパーク
      title: CreateParkResponse
      additionalProperties: false
    aozorapark.park.v1.CreateTicketTypeRequest:
      type: object
      properties:
        parkId:
          type: string
          title: park_id
          minLength: 1
          description: park_id は券種を登録するパークの識別子
        name:
          type: string
          title: name
          maxLength: 100
          minLength: 1
          description: name は券種の表示名、100 文字の上限は一覧や通知での表示が壊れないための歯止め
        price:
          type: string
          title: price
          minimum: 0
          format: int64
          description: price は販売価格、単位は円、無料の券種があるため 0 を許す
        entryTimeFrom:
          type: string
          title: entry_time_from
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: entry_time_from は入場できる時間帯の開始時刻
        entryTimeTo:
